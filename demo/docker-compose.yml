services:
  mysql:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    environment:
      MYSQL_DATABASE: ekote
      MYSQL_USER: ekote
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-development-only}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -Nse 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ekote
      SPRING_DATASOURCE_USERNAME: ekote
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-local-development-only}
      EKOTE_PUBLIC_BASE_URL: ${EKOTE_PUBLIC_BASE_URL:-http://localhost:8080}
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_GENERATE_STATISTICS: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql-data:

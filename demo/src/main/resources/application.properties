
# Database settings for production, referencing environment variables provided by Railway
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.generate_statistics=false

# Thymeleaf settings
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# DevTools settings (won't be used in production but is good for development)
spring.devtools.restart.enabled=false

# Expose only a status health check; never disclose service details publicly.
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

logging.pattern.level=%5p [requestId:%X{requestId:-none}]

# Versioned changes only. Never silently baseline an unknown nonempty database.
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

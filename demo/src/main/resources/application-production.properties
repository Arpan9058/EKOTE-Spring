# Enable only behind a correctly configured HTTPS endpoint.
server.servlet.session.cookie.secure=true
# Require an explicit deployment URL when this profile is enabled.
ekote.public-base-url=${EKOTE_PUBLIC_BASE_URL}
# Forwarded headers remain disabled; configure only when the proxy strips client headers.
server.forward-headers-strategy=none
# Boot's built-in Logstash JSON encoder includes MDC (including requestId).
logging.structured.format.console=logstash

name: Quality and security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: demo/pom.xml
      - name: Verify static-analysis gate failure handling
        run: python3 scripts/test-codeql-gate.py
      - name: Check Java formatting and static rules
        working-directory: demo
        run: ./mvnw --batch-mode --no-transfer-progress validate
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: demo/pom.xml
      - name: Compile Java and run unit, repository and HTTP tests
        working-directory: demo
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Upload resolved dependencies for the security scan
        uses: actions/upload-artifact@v7
        with:
          name: resolved-sbom
          path: demo/target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: demo/target/site/jacoco/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: demo/target/surefire-reports/
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: demo/pom.xml
      - name: Package the application after the test job passes
        working-directory: demo
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests
      - uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: demo/target/demo-0.0.1-SNAPSHOT.jar
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
  dependency-audit:
    needs: test
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@0a65f82af05cd58cf587827b0bb0489548c18346 # v2.7.0
    with:
      scan-args: |-
        --allow-no-lockfiles=false
        -L
        ./application.cdx.json
      download-artifact: resolved-sbom
      upload-sarif: false
      fail-on-vuln: true

  mysql-concurrency:
    needs: lint
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_DATABASE: ekote_concurrency
          MYSQL_USER: ekote
          MYSQL_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_PASSWORD: root-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: demo/pom.xml
      - name: Verify transactions under MySQL repeatable-read isolation
        working-directory: demo
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/ekote_concurrency
          SPRING_DATASOURCE_USERNAME: ekote
          SPRING_DATASOURCE_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
          SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
          SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=StockConcurrencyIntegrationTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mysql-concurrency-reports
          path: demo/target/surefire-reports/
  kubernetes:
    needs: [build, dependency-audit, mysql-concurrency, release-integration, image-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-verified kind and kubectl
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
          curl -fsSLo kind.sha256sum https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64.sha256sum
          mv kind kind-linux-amd64
          sha256sum --check kind.sha256sum
          chmod +x kind-linux-amd64
          sudo mv kind-linux-amd64 /usr/local/bin/kind
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
      - name: Build tested container and create isolated cluster
        run: |
          docker build -t ekote-spring:local demo
          kind create cluster --name ekote-ci --image kindest/node:v1.32.2@sha256:142f543559cc55d64e1ab9341df08e5ced84bd2e893736da8f51320f26f5950b --config deploy/testing/kind.yaml --wait 0s
          python3 scripts/install-test-network-policy.py
          kind load docker-image ekote-spring:local --name ekote-ci
      - name: Validate and deploy manifests
        run: |
          python3 scripts/create-kubernetes-secret.py
          kubectl apply --dry-run=server -k deploy/kubernetes -o json > /tmp/manifests.json
          python3 scripts/check-kubernetes.py < /tmp/manifests.json
          python3 scripts/test-kubernetes-policy.py < /tmp/manifests.json
          kubectl apply -k deploy/kubernetes
          kubectl -n ekote rollout status statefulset/mysql --timeout=300s
          kubectl -n ekote rollout status deployment/ekote --timeout=300s
      - name: Exercise HTTP and internal health/metrics
        run: python3 scripts/smoke-kubernetes.py --verify-database-recovery
      - name: Prove network-policy allow and deny flows
        run: python3 scripts/verify-network-policies.py
      - name: Collect deployment diagnostics
        if: failure()
        run: |
          kubectl -n ekote get pods,pvc
          kubectl -n ekote get events --sort-by=.lastTimestamp
          kubectl -n ekote logs deployment/ekote --tail=100 || true
      - name: Remove isolated cluster
        if: always()
        run: kind delete cluster --name ekote-ci

  release-integration:
    needs: build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_DATABASE: ekote_migration_test
          MYSQL_USER: ekote
          MYSQL_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_PASSWORD: root-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/ekote_migration_test
      SPRING_DATASOURCE_USERNAME: ekote
      SPRING_DATASOURCE_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      EKOTE_MIGRATION_TEST_URL: jdbc:mysql://127.0.0.1:3306/ekote_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: demo/pom.xml
      - name: Test fresh migrations, explicit legacy adoption and independent session repositories
        working-directory: demo
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=MySqlMigrationIntegrationTest
      - uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: .ci-jar
      - name: Start two app processes against the migrated database
        run: |
          java -Xmx384m -jar .ci-jar/demo-0.0.1-SNAPSHOT.jar --server.address=127.0.0.1 --server.port=18082 > /tmp/node-a.log 2>&1 &
          java -Xmx384m -jar .ci-jar/demo-0.0.1-SNAPSHOT.jar --server.address=127.0.0.1 --server.port=18083 > /tmp/node-b.log 2>&1 &
          python3 - <<'PYTHON'
          import time, urllib.request
          for port in (18082, 18083):
              for attempt in range(90):
                  try:
                      with urllib.request.urlopen(f'http://127.0.0.1:{port}/actuator/health', timeout=2) as response:
                          assert response.status == 200
                      break
                  except OSError:
                      time.sleep(1)
              else:
                  raise RuntimeError(f'App on port {port} failed readiness')
          PYTHON
      - name: Verify authentication and logout across processes
        run: python3 scripts/smoke-shared-sessions.py
      - name: Verify shared login quotas and bypass resistance
        run: python3 scripts/smoke-auth-throttle.py
      - name: Restore and compare a private backup in a fresh disposable database
        run: python3 scripts/verify-backup-restore.py --source-container '${{ job.services.mysql.id }}'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: release-integration-diagnostics
          path: |
            /tmp/node-a.log
            /tmp/node-b.log
            demo/target/surefire-reports/
  image-audit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build verified runtime
        run: docker build -t ekote-security:ci demo
      - name: Scan all OS severities without hiding unfixed advisories
        run: |
          mkdir -p scan-results
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/scan-results:/output" aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 image --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --pkg-types os --format json --output /output/image.json ekote-security:ci
          python3 scripts/check-image-audit.py scan-results/image.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-os-audit
          path: scan-results/

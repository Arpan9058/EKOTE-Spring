name: Application security analysis
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: demo/pom.xml
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: java-kotlin
          queries: security-extended
      - name: Build Java for static analysis
        working-directory: demo
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          output: codeql-results
          # Code scanning is not enabled in this repository. Keep a real analysis
          # and local gate rather than failing only while uploading its report.
          upload: never
          upload-database: false
      - name: Gate high-severity application security findings
        run: python3 scripts/check-codeql.py codeql-results
      - name: Preserve complete static-analysis reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
